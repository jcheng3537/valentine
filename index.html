        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MyHandwriting', 'Comic Sans MS', cursive, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .screen {
            display: none;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .fade-out {
            animation: fadeOut 0.6s ease forwards;
        }

        button {
            font-family: 'MyHandwriting', 'Comic Sans MS', cursive, sans-serif;
            font-size: 20px;
            padding: 15px 40px;
            border: 2px solid black;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        button:hover {
            background: rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        #enterScreen button {
            background: #e8d7e8;
            font-size: 22px;
            padding: 18px 50px;
            border: none;
        }

        #enterScreen button:hover {
            background: #d4c0d4;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .text-line {
            font-size: 24px;
            margin: 15px 0;
            opacity: 0;
            animation: slideIn 0.5s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nervous-text {
            font-size: 18px;
            color: #666;
            font-style: italic;
        }

        .drumroll-text {
            font-size: 28px;
            margin: 30px 0;
        }

        .question-box {
            background: #e8d7e8;
            border: none;
            padding: 30px 20px;
            border-radius: 12px;
            margin: 30px 0;
        }

        .question-box h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            position: relative;
        }

        .choice-button {
            font-size: 18px;
            padding: 12px 30px;
            min-width: 120px;
            background: white;
            border: none;
        }

        .choice-button:hover {
            background: #f5f5f5;
        }

        #noButton {
            position: relative;
            transition: all 0.3s ease;
        }

        .dodge-text {
            font-size: 18px;
            margin-top: 15px;
            color: #666;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }

        .confetti-heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 1000;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin: 25px 0;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .option-button {
            font-size: 18px;
            padding: 15px 20px;
            text-align: left;
            width: 100%;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .option-button:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .long-text {
            font-size: 22px;
            line-height: 1.6;
            max-width: 450px;
            margin: 0 auto;
        }

        .text-input-container {
            margin: 20px 0;
        }

        .text-input {
            font-family: 'MyHandwriting', 'Comic Sans MS', cursive, sans-serif;
            font-size: 18px;
            padding: 12px 15px;
            border: 2px solid black;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            margin-top: 10px;
        }

        .finish-button {
            margin-top: 30px;
            background: #e8d7e8;
            font-size: 18px;
            padding: 12px 35px;
            border: none;
        }

        .finish-button:hover {
            background: #d4c0d4;
        }

        /* Hidden Google Form */
        iframe {
            display: none;
        }

        @media (max-width: 480px) {
            .text-line {
                font-size: 20px;
            }
            
            .question-box h1 {
                font-size: 26px;
            }

            .long-text {
                font-size: 19px;
            }

            button {
                font-size: 18px;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Screen 1: Enter Button -->
        <div class="screen active" id="enterScreen">
            <button onclick="startExperience()">enter</button>
        </div>

        <!-- Screen 2: Nervous text -->
        <div class="screen" id="nervousScreen">
            <div class="text-line nervous-text">(currently mega nervous but also cheesing REALLY hard...)</div>
        </div>

        <!-- Screen 3: Drumroll -->
        <div class="screen" id="drumrollScreen">
            <div class="text-line drumroll-text">drumroll...</div>
        </div>

        <!-- Screen 4: The Question -->
        <div class="screen" id="questionScreen">
            <div class="question-box">
                <h1>will you be my valentine?</h1>
                <div class="button-container">
                    <button class="choice-button" id="noButton" onclick="handleNo()">no :(</button>
                    <button class="choice-button" onclick="handleYes()">yes :)</button>
                </div>
                <div id="dodgeText" class="dodge-text"></div>
            </div>
        </div>

        <!-- Screen 5: No Response -->
        <div class="screen" id="noScreen"></div>

        <!-- Screen 6: Yes Response - Part 1 -->
        <div class="screen" id="yesScreen1"></div>

        <!-- Screen 7: Yes Response - Confession -->
        <div class="screen" id="yesScreen2"></div>

        <!-- Screen 8: Long text -->
        <div class="screen" id="longTextScreen"></div>

        <!-- Screen 9: Options -->
        <div class="screen" id="optionsScreen"></div>

        <!-- Screen 10: Response to choice -->
        <div class="screen" id="responseScreen"></div>

        <!-- Screen 11: Finish -->
        <div class="screen" id="finishScreen">
            <div class="text-line" style="font-size: 28px;">thanks for being here :))</div>
            <button class="finish-button" onclick="restart()">back to start</button>
        </div>
    </div>

    <!-- Hidden Google Form iframe -->
    <iframe id="hiddenForm" name="hiddenFrame"></iframe>

    <script>
        let noClickCount = 0;
        let currentScreen = 'enterScreen';

        function showScreen(screenId, delay = 0) {
            setTimeout(() => {
                const current = document.getElementById(currentScreen);
                const next = document.getElementById(screenId);
                
                if (current) {
                    current.classList.remove('active');
                }
                
                if (next) {
                    next.classList.add('active');
                    currentScreen = screenId;
                }
            }, delay);
        }

        function startExperience() {
            showScreen('nervousScreen');
            setTimeout(() => {
                showScreen('drumrollScreen');
            }, 3000);
            setTimeout(() => {
                showScreen('questionScreen');
            }, 5500);
        }

        function handleNo() {
            const button = document.getElementById('noButton');
            const dodgeText = document.getElementById('dodgeText');
            
            if (noClickCount === 0) {
                // First click - move button
                const randomX = (Math.random() - 0.5) * 100;
                const randomY = (Math.random() - 0.5) * 100;
                button.style.transform = `translate(${randomX}px, ${randomY}px)`;
                noClickCount++;
            } else if (noClickCount === 1) {
                // Second click - move again with text
                const randomX = (Math.random() - 0.5) * 120;
                const randomY = (Math.random() - 0.5) * 120;
                button.style.transform = `translate(${randomX}px, ${randomY}px)`;
                dodgeText.textContent = 'you sure? 👀';
                noClickCount++;
            } else {
                // Third click - actually show no response
                showNoResponse();
            }
        }

        function showNoResponse() {
            const noScreen = document.getElementById('noScreen');
            const lines = [
                'nooooooooooooooooooooo...',
                'jkjk it\'s all chill',
                'all is well',
                'you may exit now'
            ];
            
            noScreen.innerHTML = '';
            showScreen('noScreen');
            
            lines.forEach((line, index) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'text-line';
                    div.textContent = line;
                    div.style.animationDelay = '0s';
                    noScreen.appendChild(div);
                }, index * 1500);
            });
        }

        function handleYes() {
            createConfetti();
            showYesResponse();
        }

        function createConfetti() {
            const hearts = ['💜', '💜', '💜', '💜', '💜'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'confetti-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    heart.style.animationDelay = '0s';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 5000);
                }, i * 50);
            }
        }

        function showYesResponse() {
            const yesScreen1 = document.getElementById('yesScreen1');
            const lines1 = [
                'yay!!!',
                'i\'m so very happy',
                '(you seriously have no clue)'
            ];
            
            yesScreen1.innerHTML = '';
            showScreen('yesScreen1');
            
            lines1.forEach((line, index) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'text-line';
                    div.textContent = line;
                    yesScreen1.appendChild(div);
                }, index * 1500);
            });

            // After part 1, show confession
            setTimeout(() => {
                showConfession();
            }, (lines1.length * 1500) + 2000);
        }

        function showConfession() {
            const yesScreen2 = document.getElementById('yesScreen2');
            const lines2 = [
                'i do have a confession though...',
                'i don\'t actually know what\'s next...'
            ];
            
            yesScreen2.innerHTML = '';
            showScreen('yesScreen2');
            
            lines2.forEach((line, index) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'text-line';
                    div.textContent = line;
                    yesScreen2.appendChild(div);
                }, index * 2500);
            });

            setTimeout(() => {
                showLongText();
            }, (lines2.length * 2500) + 2000);
        }

        function showLongText() {
            const longTextScreen = document.getElementById('longTextScreen');
            longTextScreen.innerHTML = '<div class="text-line long-text">you see, if i were over there, i\'d ask you out on a proper date!<br><br>but alas... you\'re too far away and i don\'t know how to proceed :(</div>';
            showScreen('longTextScreen');

            setTimeout(() => {
                showOptions();
            }, 7000);
        }

        function showOptions() {
            const optionsScreen = document.getElementById('optionsScreen');
            optionsScreen.innerHTML = `
                <div class="text-line" style="margin-bottom: 10px;">so, i'll let you decide what's next:</div>
                <div class="options-grid">
                    <button class="option-button" onclick="handleChoice('A', 'nothing.')">A) nothing.</button>
                    <button class="option-button" onclick="handleChoice('B', 'talk and sort stuff out')">B) talk and sort stuff out</button>
                    <button class="option-button" onclick="handleChoice('C', 'do a one-and-done themed activity and forget this ever happened LOL')">C) do a one-and-done themed activity and forget this ever happened LOL</button>
                    <button class="option-button" onclick="showOptionD()">D) something else (you tell me)</button>
                </div>
            `;
            showScreen('optionsScreen');
        }

        function showOptionD() {
            const optionsScreen = document.getElementById('optionsScreen');
            optionsScreen.innerHTML = `
                <div class="text-input-container">
                    <div style="font-size: 18px; margin-bottom: 10px;">tell me your idea(s):</div>
                    <input type="text" class="text-input" id="optionDInput" placeholder="type here...">
                    <br><br>
                    <button onclick="submitOptionD()" style="margin-top: 15px;">submit</button>
                </div>
            `;
        }

        function submitOptionD() {
            const input = document.getElementById('optionDInput').value;
            handleChoice('D', input || 'something else');
        }

        function handleChoice(option, text) {
            // Submit to Google Form
            submitToGoogleForm(option, text);

            // Show response
            const responses = {
                'A': 'alrighty. noted.',
                'B': 'okie dokie!',
                'C': 'interesting... not what i was expecting, but we can make it happen',
                'D': 'okie dokie!'
            };

            const responseScreen = document.getElementById('responseScreen');
            responseScreen.innerHTML = `
                <div class="text-line">${responses[option]}</div>
                <button class="finish-button" onclick="showFinish()">finish</button>
            `;
            showScreen('responseScreen');
        }

        function submitToGoogleForm(option, text) {
            const FORM_ID = '1FAIpQLSej292uz3cLtmNZoj0nFcGv2uRB1zkpFMr-LQPEAAs7OUAQ9w';
            const OPTION_ENTRY_ID = 'entry.1314040120';
            const TEXT_ENTRY_ID = 'entry.2113610854';
            
            const formUrl = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse?${OPTION_ENTRY_ID}=${encodeURIComponent(option)}&${TEXT_ENTRY_ID}=${encodeURIComponent(text)}&submit=Submit`;
            
            const iframe = document.getElementById('hiddenForm');
            iframe.src = formUrl;
        }

        function showFinish() {
            showScreen('finishScreen');
        }

        function restart() {
            // Reset everything
            noClickCount = 0;
            document.getElementById('noButton').style.transform = '';
            document.getElementById('dodgeText').textContent = '';
            showScreen('enterScreen');
        }
    </script>
</body>
</html>
